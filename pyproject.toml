[project]
name = "agent-lab"
version = "0.1.0"
description = "手写 AI Agent 实验仓库：API 调用 / 结构化输出 / Function Calling / 3GPP 文档解析"
readme = "README.md"
authors = [
    { name = "hish-hish", email = "3196593523@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agent-lab = "agent_lab:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
